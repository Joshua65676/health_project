services:
  - type: web
    name: mediai-php-api
    runtime: docker
    dockerfilePath: ./php-app/Dockerfile
    dockerContext: ./php-app
    healthCheckPath: /health.php
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: FRONTEND_ORIGIN
        value: https://mediai-zeta.vercel.app
      - key: FRONTEND_LOGIN_URL
        value: https://mediai-zeta.vercel.app/login
      - key: FRONTEND_CALLBACK_URL
        value: https://mediai-zeta.vercel.app/chatdashboard
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: None
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_ENCRYPTION
        value: tls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: MediAI
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: MEDIASTACK_KEY
        sync: false
